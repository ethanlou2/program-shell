name: sync-submodules
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `schedule` only ever fires this workflow file as it exists on the
      # default branch — it does NOT run separately per branch. To keep
      # dev/stage/prod (and main) all auto-synced in real time from a single
      # scheduled run, we fan out across branches here instead of duplicating
      # this file on every branch. Add/remove branch names as they're created.
      matrix:
        branch: [main, dev, stage, prod]
    steps:
      # Cross-repo access (mysite, mysite1, dispatcher, cdn may be private) via a
      # GitHub App installation token, generated fresh on every run (~1h TTL).
      # No PAT to rotate: only the App's private key (secrets.SYNC_APP_PRIVATE_KEY)
      # and its numeric id (secrets.SYNC_APP_ID) need to exist, and neither expires
      # unless you explicitly regenerate/revoke them.
      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ethanlou2
          repositories: |
            program-shell
            mysite
            mysite1
            dispatcher
            cdn

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - run: |
          # Plain checkout to each submodule's remote tip (no --merge/--rebase):
          # program-shell never carries local edits inside the submodule working
          # trees, so there's nothing to merge. Using --merge here breaks because
          # .gitmodules marks all four submodules shallow=true (for faster Cloud
          # Manager builds) and shallow history can make git report "refusing to
          # merge unrelated histories" even for a simple fast-forward.
          git submodule update --remote
          git config user.name "shell-sync-bot"
          git config user.email "bot@yourorg.com"
          git add mysite mysite1 dispatcher cdn
          git diff --cached --quiet || git commit -m "chore: sync submodules to latest main"
          git push origin ${{ matrix.branch }}
